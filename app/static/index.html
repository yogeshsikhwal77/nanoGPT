<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NanoGPT Interactive</title>
  <style>
    :root {
      /* Dark Theme (Default) */
      --bg-main: #0a0a0a;
      --bg-surface: #171717;
      --bg-chat-user: #262626;
      --bg-chat-ai: transparent;
      --text-main: #f5f5f5;
      --text-muted: #a3a3a3;
      --border-color: #333;
      /* Requested colors: Green, Blue, Violet, Red */
      --accent-gradient: linear-gradient(270deg, #10b981, #3b82f6, #8b5cf6, #ef4444);
    }

    [data-theme="light"] {
      /* Light Theme */
      --bg-main: #ffffff;
      --bg-surface: #f3f4f6;
      --bg-chat-user: #e5e7eb;
      --bg-chat-ai: transparent;
      --text-main: #111827;
      --text-muted: #6b7280;
      --border-color: #d1d5db;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.4s ease, color 0.4s ease;
      overflow: hidden;
    }

    /* Animated Gradient Header Bar */
    .gradient-bar {
      height: 4px;
      width: 100%;
      background: var(--accent-gradient);
      background-size: 800% 800%;
      animation: GradientAnimation 8s ease infinite;
    }

    @keyframes GradientAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Navbar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: var(--bg-main);
      border-bottom: 1px solid var(--border-color);
      z-index: 10;
      transition: background-color 0.4s, border-color 0.4s;
    }

    .brand { 
      font-weight: 700; 
      font-size: 1.2rem; 
      letter-spacing: -0.5px; 
    }

    .controls { 
      display: flex; 
      gap: 1rem; 
      align-items: center; 
    }

    button.icon-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      transition: all 0.2s;
    }
    
    button.icon-btn:hover { 
      filter: brightness(1.2); 
    }

    /* Main Chat Layout */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Settings Panel (Collapsible) */
    .settings-panel {
      display: flex;
      max-height: 0;
      overflow: hidden;
      background-color: var(--bg-surface);
      border-bottom: 1px solid transparent;
      padding: 0 2rem;
      flex-wrap: wrap;
      gap: 1.5rem;
      transition: all 0.4s ease;
    }
    .settings-panel.active { 
      max-height: 200px; 
      padding: 1.5rem 2rem; 
      border-bottom: 1px solid var(--border-color); 
    }

    .setting-group { 
      display: flex; 
      flex-direction: column; 
      gap: 0.4rem; 
    }
    .setting-group label { 
      font-size: 0.8rem; 
      color: var(--text-muted); 
      font-weight: 600; 
      text-transform: uppercase; 
    }
    .setting-group input, .setting-group select {
      background-color: var(--bg-main);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0.6rem;
      border-radius: 8px;
      outline: none;
      transition: background-color 0.4s, color 0.4s;
    }

    /* Story Context Area */
    .story-container {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-main);
      flex-shrink: 0;
      transition: background-color 0.4s;
    }
    
    .story-container label {
      display: block; 
      font-size: 0.85rem; 
      color: var(--text-muted); 
      margin-bottom: 0.5rem; 
      font-weight: 600; 
      text-transform: uppercase;
    }

    .story-container textarea {
      width: 100%;
      background: transparent;
      color: var(--text-main);
      border: none;
      resize: vertical;
      min-height: 60px;
      font-size: 1.05rem;
      line-height: 1.5;
      outline: none;
      font-family: inherit;
    }

    /* Chat Area */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .message {
      max-width: 80%;
      padding: 1rem 1.5rem;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 1.05rem;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn { 
      from { opacity: 0; transform: translateY(10px); } 
      to { opacity: 1; transform: translateY(0); } 
    }

    .message.user {
      align-self: flex-end;
      background-color: var(--bg-chat-user);
      border-bottom-right-radius: 4px;
    }

    .message.ai {
      align-self: flex-start;
      background-color: var(--bg-chat-ai);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;
    }

    .meta-data {
      display: block;
      margin-top: 0.8rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      padding-top: 0.5rem;
    }

    /* Fixed Bottom Input */
    .input-area {
      padding: 1.5rem 2rem;
      background-color: var(--bg-main);
      border-top: 1px solid var(--border-color);
      transition: background-color 0.4s;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      max-width: 900px;
      margin: 0 auto;
      border-radius: 24px;
      background-color: var(--bg-surface);
      padding: 0.3rem;
      transition: background-color 0.4s;
    }

    /* The Animated Glowing Border Effect on Input */
    .input-wrapper::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 26px;
      background: var(--accent-gradient);
      background-size: 400% 400%;
      animation: GradientAnimation 4s ease infinite;
      z-index: -1;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .input-wrapper:focus-within::before { 
      opacity: 1; 
    }

    .input-wrapper input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 1rem 1.5rem;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
    }

    .submit-btn {
      margin: 0.3rem;
      padding: 0.7rem 1.5rem;
      border-radius: 18px;
      background: var(--text-main);
      color: var(--bg-main);
      font-weight: 600;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .submit-btn:hover { opacity: 0.9; }
    .submit-btn:active { transform: scale(0.95); }

    /* Typing Indicator */
    .typing {
      display: flex;
      gap: 6px;
      padding: 1.2rem 1.5rem;
      align-items: center;
    }
    .typing-dot {
      width: 8px;
      height: 8px;
      background-color: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    @media (max-width: 768px) {
      header, .story-container, .chat-container, .input-area { padding: 1rem; }
      .message { max-width: 95%; }
    }
  </style>
</head>
<body>

  <!-- Top Animated Bar -->
  <div class="gradient-bar"></div>

  <!-- Header -->
  <header>
    <div class="brand">NanoGPT Q&A</div>
    <div class="controls">
      <button class="icon-btn" id="toggle-settings">⚙️ Settings</button>
      <button class="icon-btn" id="toggle-theme">🌓 Theme</button>
    </div>
  </header>

  <!-- Settings Dropdown -->
  <div class="settings-panel" id="settings-panel">
    <div class="setting-group">
      <label>Model Engine</label>
      <select id="model_name">
        <option value="fiko">Fiko (15M Params)</option>
        <option value="fire">Fire (33M Params)</option>
      </select>
    </div>
    <div class="setting-group">
      <label>Temperature</label>
      <input type="number" id="temperature" value="0.2" step="0.1" min="0" max="2">
    </div>
    <div class="setting-group">
      <label>Max Tokens</label>
      <input type="number" id="max_tokens" value="50" min="5" max="128">
    </div>
  </div>

  <main>
    <!-- Story Context Box -->
    <div class="story-container">
      <label>Story Context</label>
      <textarea id="story">Tim lost his red ball in the garden. He searched behind the shed and found it under the oak tree.</textarea>
    </div>

    <!-- Chat History -->
    <div class="chat-container" id="chat-box">
      <div class="message ai">
        Hello! I am ready to answer questions based on the story above. What would you like to know?
      </div>
    </div>
  </main>

  <!-- Chat Input -->
  <div class="input-area">
    <div class="input-wrapper">
      <input type="text" id="question" placeholder="Ask a question... (e.g. Where did Tim find his ball?)" onkeypress="handleEnter(event)">
      <button class="submit-btn" onclick="askQuestion()">Send</button>
    </div>
  </div>

  <script>
    // Theme Toggle Logic (White/Black themes)
    const themeBtn = document.getElementById('toggle-theme');
    themeBtn.addEventListener('click', () => {
      const currentTheme = document.body.getAttribute('data-theme');
      if (currentTheme === 'light') {
        document.body.removeAttribute('data-theme');
      } else {
        document.body.setAttribute('data-theme', 'light');
      }
    });

    // Settings Toggle Logic
    const settingsBtn = document.getElementById('toggle-settings');
    const settingsPanel = document.getElementById('settings-panel');
    settingsBtn.addEventListener('click', () => {
      settingsPanel.classList.toggle('active');
    });

    // Chat Interface Logic
    const chatBox = document.getElementById('chat-box');
    const questionInput = document.getElementById('question');

    function handleEnter(e) {
      if (e.key === 'Enter') askQuestion();
    }

    function appendMessage(text, sender, meta = null) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);
      msgDiv.innerText = text;

      // Add meta data for AI responses (latency/tokens)
      if (meta) {
        const metaDiv = document.createElement('span');
        metaDiv.classList.add('meta-data');
        metaDiv.innerText = meta;
        msgDiv.appendChild(metaDiv);
      }

      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgDiv;
    }

    function showTyping() {
      const typingDiv = document.createElement('div');
      typingDiv.classList.add('message', 'ai', 'typing');
      typingDiv.id = 'typing-indicator';
      typingDiv.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
      chatBox.appendChild(typingDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function removeTyping() {
      const typingDiv = document.getElementById('typing-indicator');
      if (typingDiv) typingDiv.remove();
    }

    // Backend Request Logic
    async function askQuestion() {
      const question = questionInput.value.trim();
      if (!question) return;

      const story = document.getElementById('story').value;
      const model_name = document.getElementById('model_name').value;
      const temperature = parseFloat(document.getElementById('temperature').value);
      const max_tokens = parseInt(document.getElementById('max_tokens').value);
      
      appendMessage(question, 'user');
      questionInput.value = '';
      showTyping();

      /* 
        ========================================================
        This is where your Python FastApi / Flask backend connects
        ========================================================
      */
      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ story, question, temperature, max_tokens, model_name })
        });
        
        const data = await res.json();
        removeTyping();

        if (res.ok) {
           appendMessage(
             data.answer || "No response generated.", 
             'ai', 
             `Latency: ${data.inference_time_ms} ms | Tokens: ${data.tokens_generated} | Engine: ${model_name.toUpperCase()}`
           );
        } else {
           appendMessage(`Error: ${data.detail}`, 'ai');
        }
      } catch (err) {
        // Fallback for demonstration if backend is not running
        setTimeout(() => {
          removeTyping();
          appendMessage("Error contacting backend. Is your python server running? \n\n(Mocked Fallback: He found it under the oak tree.)", 'ai', "Latency: 450 ms | Tokens: 10 | Engine: LOCAL_MOCK");
        }, 1000);
      }
    }
  </script>
</body>
</html>
