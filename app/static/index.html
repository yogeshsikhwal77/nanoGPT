<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NanoGPT Q&A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0f12; --surface:#15181c; --surface-2:#1c2025; --line:#282d33;
    --ink:#eef0f2; --ink-muted:#8b939c; --user-bubble:#22262b;
    --accent-a:#34d399; --accent-b:#a78bfa;
    --accent-grad:linear-gradient(270deg,#3b82f6,#10b981,#8b5cf6,#f59e0b,#ef4444,#3b82f6);
    --radius-lg:18px; --radius-sm:10px;
  }
  [data-theme="light"]{
    --bg:#faf9f7; --surface:#ffffff; --surface-2:#f1f0ee; --line:#e2e0dc;
    --ink:#191a1c; --ink-muted:#6b6f75; --user-bubble:#ecebe8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter',sans-serif; background:var(--bg); color:var(--ink);
    height:100vh; display:flex; flex-direction:column; overflow:hidden;
    transition:background .35s ease,color .35s ease;
  }
  .brandfont{font-family:'Space Grotesk',sans-serif}

  .topline{height:3px;background:var(--accent-grad);background-size:300% 300%;animation:flow 6s ease infinite}
  @keyframes flow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

  header{
    display:flex; justify-content:space-between; align-items:center;
    padding:1.1rem 1.75rem; border-bottom:1px solid var(--line);
  }
  .brand{font-weight:700; font-size:1.15rem; letter-spacing:-.01em}
  .brand span{
    background:var(--accent-grad); background-size:300% 300%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:flow 5s ease infinite;
  }
  .controls{display:flex; gap:.6rem}
  .icon-btn{
    width:38px; height:38px; display:flex; align-items:center; justify-content:center;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    color:var(--ink-muted); cursor:pointer; transition:border-color .2s,color .2s;
  }
  .icon-btn:hover{border-color:var(--accent-b); color:var(--ink)}
  .icon-btn svg{width:17px; height:17px}

  main{flex:1; display:flex; flex-direction:column; overflow:hidden}

  .settings-panel{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:1.25rem; max-height:0; overflow:hidden; padding:0 1.75rem;
    background:var(--surface); border-bottom:1px solid transparent;
    transition:max-height .35s ease, padding .35s ease;
  }
  .settings-panel.active{max-height:220px; padding:1.25rem 1.75rem; border-bottom-color:var(--line)}
  .setting-group{display:flex; flex-direction:column; gap:.45rem}
  .setting-group label{font-size:.78rem; color:var(--ink-muted); font-weight:500}
  .setting-group select, .setting-group input[type=number]{
    background:var(--surface-2); color:var(--ink); border:1px solid var(--line);
    padding:.55rem .6rem; border-radius:var(--radius-sm); font-family:inherit; font-size:.85rem; outline:none;
  }
  .range-row{display:flex; align-items:center; gap:.6rem}
  .range-row input[type=range]{flex:1; accent-color:var(--accent-b)}
  .range-row span{font-size:.8rem; color:var(--ink-muted); min-width:2ch}

  .story-container{
    position:relative; padding:1.1rem 1.75rem 1.1rem 2rem; border-bottom:1px solid var(--line);
    background:var(--surface);
  }
  .story-container::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:var(--accent-grad); background-size:400% 400%; animation:flow 6s ease infinite;
  }
  .story-container label{display:block; font-size:.8rem; color:var(--ink-muted); margin-bottom:.4rem}
  .story-container textarea{
    width:100%; background:transparent; color:var(--ink); border:none; resize:vertical;
    min-height:44px; font-family:inherit; font-size:1rem; line-height:1.55; outline:none;
  }

  .chat-container{flex:1; overflow-y:auto; padding:1.75rem; display:flex; flex-direction:column; gap:1.4rem}
  .chat-container::-webkit-scrollbar{width:8px}
  .chat-container::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px}

  .message{max-width:78%; line-height:1.6; font-size:1rem; animation:rise .3s ease-out}
  @keyframes rise{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)}}
  .message.user{
    align-self:flex-end; background:var(--user-bubble); padding:.85rem 1.2rem;
    border-radius:16px 16px 4px 16px;
  }
  .message.ai{position:relative; align-self:flex-start; padding-left:1rem}
  .message.ai::before{
    content:""; position:absolute; left:0; top:2px; bottom:2px; width:2px;
    background:var(--accent-grad); background-size:400% 400%; animation:flow 6s ease infinite;
  }
  .meta-data{
    display:flex; align-items:center; gap:.35rem; margin-top:.55rem;
    font-size:.75rem; color:var(--ink-muted);
  }
  .meta-data svg{width:12px; height:12px; opacity:.8}

  .typing{display:flex; gap:5px; padding-left:1rem; align-items:center}
  .typing-dot{width:6px; height:6px; border-radius:50%; background:var(--ink-muted); animation:bounce 1.3s infinite ease-in-out both}
  .typing-dot:nth-child(1){animation-delay:-.28s}
  .typing-dot:nth-child(2){animation-delay:-.14s}
  @keyframes bounce{0%,80%,100%{transform:scale(0)} 40%{transform:scale(1)}}

  .input-area{padding:1.25rem 1.75rem; border-top:1px solid var(--line)}
  .input-wrapper{
    position:relative; display:flex; max-width:900px; margin:0 auto;
    border-radius:22px; background:var(--surface); border:1px solid var(--line);
    padding:.3rem; transition:border-color .25s;
  }
  .input-wrapper::before{
    content:""; position:absolute; inset:-1px; border-radius:23px; padding:1px;
    background:var(--accent-grad); background-size:300% 300%; animation:flow 5s ease infinite;
    opacity:0; transition:opacity .25s ease; z-index:-1;
  }
  .input-wrapper:focus-within{border-color:transparent}
  .input-wrapper:focus-within::before{opacity:1}
  .input-wrapper input{
    flex:1; background:transparent; border:none; padding:.85rem 1.1rem;
    color:var(--ink); font-family:inherit; font-size:.95rem; outline:none;
  }
  .send-btn{
    width:42px; height:42px; margin:.25rem; border:none; border-radius:16px;
    background:var(--accent-grad); background-size:300% 300%; animation:flow 5s ease infinite;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:transform .12s ease;
  }
  .send-btn:hover{transform:scale(1.05)}
  .send-btn:active{transform:scale(.93)}
  .send-btn svg{width:18px; height:18px; stroke:#0c0f12}

  @media (max-width:720px){
    header,.story-container,.chat-container,.input-area{padding:1rem}
    .message{max-width:92%}
  }
</style>
</head>
<body>

<div class="topline"></div>

<header>
  <div class="brand brandfont">nano<span>GPT</span></div>
  <div class="controls">
    <button class="icon-btn" id="toggle-settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"/></svg>
    </button>
    <button class="icon-btn" id="toggle-theme" aria-label="Toggle theme">
      <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<div class="settings-panel" id="settings-panel">
  <div class="setting-group">
    <label>Model engine & tier</label>
    <select id="model_name">
      <optgroup label="Fire (33M parameters)">
        <option value="fire-max" selected>Fire — Max (Targeted DPO v2)</option>
        <option value="fire-high">Fire — High (Baseline DPO v1)</option>
        <option value="fire-medium">Fire — Medium (Standard SFT)</option>
      </optgroup>
      <optgroup label="Fiko (15M parameters)">
        <option value="fiko-max">Fiko — Max (Targeted DPO v2)</option>
        <option value="fiko-high">Fiko — High (Baseline DPO v1)</option>
        <option value="fiko-medium">Fiko — Medium (Standard SFT)</option>
      </optgroup>
    </select>
  </div>
  <div class="setting-group">
    <label>Temperature</label>
    <div class="range-row">
      <input type="range" id="temperature" value="0.2" step="0.1" min="0" max="2">
      <span id="temp-val">0.2</span>
    </div>
  </div>
  <div class="setting-group">
    <label>Max tokens</label>
    <input type="number" id="max_tokens" value="50" min="5" max="128">
  </div>
</div>

<main>
  <div class="story-container">
    <label>Story context</label>
    <textarea id="story">Tim lost his red ball in the garden. He searched behind the shed and found it under the oak tree.</textarea>
  </div>

  <div class="chat-container" id="chat-box">
    <div class="message ai">Ready when you are — ask a question about the story above.</div>
  </div>
</main>

<div class="input-area">
  <div class="input-wrapper">
    <input type="text" id="question" placeholder="Ask a question… e.g. Where did Tim find his ball?" onkeypress="handleEnter(event)">
    <button class="send-btn" onclick="askQuestion()" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>
</div>

<script>
  // Theme toggle
  const themeBtn = document.getElementById('toggle-theme');
  const themeIcon = document.getElementById('theme-icon');
  const sunPaths = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  const moonPath = '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/>';
  themeBtn.addEventListener('click', () => {
    const isLight = document.body.getAttribute('data-theme') === 'light';
    if (isLight) { document.body.removeAttribute('data-theme'); themeIcon.innerHTML = sunPaths; }
    else { document.body.setAttribute('data-theme', 'light'); themeIcon.innerHTML = moonPath; }
  });

  // Settings toggle
  document.getElementById('toggle-settings').addEventListener('click', () => {
    document.getElementById('settings-panel').classList.toggle('active');
  });

  // Live temperature readout
  const tempInput = document.getElementById('temperature');
  const tempVal = document.getElementById('temp-val');
  tempInput.addEventListener('input', () => tempVal.textContent = tempInput.value);

  const chatBox = document.getElementById('chat-box');
  const questionInput = document.getElementById('question');
  const clockIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>';

  function handleEnter(e){ if (e.key === 'Enter') askQuestion(); }

  function appendMessage(text, sender, meta){
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('message', sender);
    const textNode = document.createElement('div');
    textNode.innerText = text;
    msgDiv.appendChild(textNode);
    if (meta){
      const metaDiv = document.createElement('div');
      metaDiv.classList.add('meta-data');
      metaDiv.innerHTML = clockIcon + '<span>' + meta + '</span>';
      msgDiv.appendChild(metaDiv);
    }
    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function showTyping(){
    const t = document.createElement('div');
    t.className = 'message ai typing';
    t.id = 'typing-indicator';
    t.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
    chatBox.appendChild(t);
    chatBox.scrollTop = chatBox.scrollHeight;
  }
  function removeTyping(){ document.getElementById('typing-indicator')?.remove(); }

  async function askQuestion(){
    const question = questionInput.value.trim();
    if (!question) return;

    const story = document.getElementById('story').value;
    const model_name = document.getElementById('model_name').value;
    const temperature = parseFloat(tempInput.value);
    const max_tokens = parseInt(document.getElementById('max_tokens').value);

    appendMessage(question, 'user');
    questionInput.value = '';
    showTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ story, question, temperature, max_tokens, model_name })
      });
      const data = await res.json();
      removeTyping();
      if (res.ok){
        appendMessage(data.answer || 'No response generated.', 'ai',
          `${data.inference_time_ms} ms · ${data.tokens_generated} tokens · ${model_name.toUpperCase()}`);
      } else {
        appendMessage(`Error: ${data.detail}`, 'ai');
      }
    } catch (err) {
      setTimeout(() => {
        removeTyping();
        appendMessage('Backend not reachable — showing a mocked reply: "He found it under the oak tree."', 'ai',
          '450 ms · 10 tokens · LOCAL_MOCK');
      }, 700);
    }
  }
</script>
</body>
</html>
