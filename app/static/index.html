<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NanoGPT Q&A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0f12; --surface:#15181c; --surface-2:#1c2025; --line:#282d33;
    --ink:#eef0f2; --ink-muted:#8b939c; --user-bubble:#22262b;
    --accent-a:#34d399; --accent-b:#a78bfa;
    --accent-grad:linear-gradient(270deg,#3b82f6,#10b981,#8b5cf6,#f59e0b,#ef4444,#3b82f6);
    --radius-lg:18px; --radius-sm:10px;
  }
  [data-theme="light"]{
    --bg:#faf9f7; --surface:#ffffff; --surface-2:#f1f0ee; --line:#e2e0dc;
    --ink:#191a1c; --ink-muted:#6b6f75; --user-bubble:#ecebe8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter',sans-serif; background:var(--bg); color:var(--ink);
    height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden;
    transition:background .35s ease,color .35s ease;
  }
  .brandfont{font-family:'Space Grotesk',sans-serif}

  .topline{height:3px;background:var(--accent-grad);background-size:300% 300%;animation:flow 6s ease infinite;flex-shrink:0}
  @keyframes flow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

  header{
    display:flex; justify-content:space-between; align-items:center;
    padding:0.9rem 1.4rem; border-bottom:1px solid var(--line); flex-shrink:0;
  }
  .brand{font-weight:700; font-size:1.15rem; letter-spacing:-.01em}
  .brand span{
    background:var(--accent-grad); background-size:300% 300%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:flow 5s ease infinite;
  }
  .controls{display:flex; gap:.6rem}
  .icon-btn{
    width:38px; height:38px; display:flex; align-items:center; justify-content:center;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    color:var(--ink-muted); cursor:pointer; transition:border-color .2s,color .2s;
  }
  .icon-btn:hover{border-color:var(--accent-b); color:var(--ink)}
  .icon-btn svg{width:17px; height:17px}

  main{flex:1; display:flex; flex-direction:column; min-height:0; overflow:hidden}

  .settings-panel{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:1rem; max-height:0; overflow:hidden; padding:0 1.4rem;
    background:var(--surface); border-bottom:1px solid transparent;
    transition:max-height .35s ease, padding .35s ease; flex-shrink:0;
  }
  .settings-panel.active{max-height:240px; padding:1rem 1.4rem; border-bottom-color:var(--line); overflow-y:auto}
  .setting-group{display:flex; flex-direction:column; gap:.4rem}
  .setting-group label{font-size:.75rem; color:var(--ink-muted); font-weight:500}
  .setting-group select, .setting-group input[type=number]{
    background:var(--surface-2); color:var(--ink); border:1px solid var(--line);
    padding:.5rem .6rem; border-radius:var(--radius-sm); font-family:inherit; font-size:.85rem; outline:none;
  }
  .range-row{display:flex; align-items:center; gap:.6rem}
  .range-row input[type=range]{flex:1; accent-color:var(--accent-b)}
  .range-row span{font-size:.8rem; color:var(--ink-muted); min-width:2ch}

  /* Preset Pills Row */
  .preset-bar{
    display:flex; align-items:center; gap:0.5rem; padding:0.6rem 1.4rem;
    background:var(--surface-2); border-bottom:1px solid var(--line);
    overflow-x:auto; white-space:nowrap; flex-shrink:0; -webkit-overflow-scrolling:touch;
  }
  .preset-bar::-webkit-scrollbar{display:none}
  .preset-label{font-size:.72rem; color:var(--ink-muted); font-weight:600; text-transform:uppercase; letter-spacing:.05em}
  .pill-btn{
    background:var(--surface); border:1px solid var(--line); border-radius:20px;
    color:var(--ink); font-size:.78rem; font-family:inherit; padding:.3rem .75rem;
    cursor:pointer; transition:all .2s; white-space:nowrap; flex-shrink:0;
  }
  .pill-btn:hover{border-color:var(--accent-a); color:var(--accent-a)}
  .pill-btn.active{border-color:var(--accent-a); background:rgba(52,211,153,0.12); color:var(--accent-a); font-weight:600}
  .pill-btn.custom-pill{border-color:var(--accent-b); color:var(--accent-b)}
  .pill-btn.custom-pill.active{background:rgba(167,139,250,0.14); border-color:var(--accent-b); color:var(--accent-b)}

  .story-container{
    position:relative; padding:.8rem 1.4rem; border-bottom:1px solid var(--line);
    background:var(--surface); flex-shrink:0;
  }
  .story-container::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:var(--accent-grad); background-size:400% 400%; animation:flow 6s ease infinite;
  }
  .story-header{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:.35rem;
  }
  .story-header label{font-size:.75rem; color:var(--ink-muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em}
  .story-tip{
    font-size:.72rem; color:var(--accent-a); background:rgba(52,211,153,0.1);
    padding:.15rem .5rem; border-radius:12px; display:inline-flex; align-items:center; gap:.25rem;
  }
  .story-container textarea{
    width:100%; background:transparent; color:var(--ink); border:none; resize:none;
    height:64px; font-family:inherit; font-size:.88rem; line-height:1.45; outline:none;
  }
  .story-container textarea::placeholder{color:var(--ink-muted); opacity:.7}

  .chat-container{
    flex:1; min-height:0; overflow-y:auto; padding:1.2rem 1.4rem;
    display:flex; flex-direction:column; gap:1.1rem; -webkit-overflow-scrolling:touch;
  }
  .chat-container::-webkit-scrollbar{width:6px}
  .chat-container::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px}

  .message{max-width:85%; line-height:1.55; font-size:.92rem; animation:rise .3s ease-out; word-break:break-word}
  @keyframes rise{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)}}
  .message.user{
    align-self:flex-end; background:var(--user-bubble); padding:.75rem 1.1rem;
    border-radius:16px 16px 4px 16px;
  }
  .message.ai{position:relative; align-self:flex-start; padding-left:.9rem}
  .message.ai::before{
    content:""; position:absolute; left:0; top:2px; bottom:2px; width:2px;
    background:var(--accent-grad); background-size:400% 400%; animation:flow 6s ease infinite;
  }
  .meta-data{
    display:flex; align-items:center; gap:.35rem; margin-top:.45rem;
    font-size:.72rem; color:var(--ink-muted);
  }
  .meta-data svg{width:11px; height:11px; opacity:.8}

  .typing{display:flex; gap:5px; padding-left:.9rem; align-items:center}
  .typing-dot{width:5px; height:5px; border-radius:50%; background:var(--ink-muted); animation:bounce 1.3s infinite ease-in-out both}
  .typing-dot:nth-child(1){animation-delay:-.28s}
  .typing-dot:nth-child(2){animation-delay:-.14s}
  @keyframes bounce{0%,80%,100%{transform:scale(0)} 40%{transform:scale(1)}}

  /* Suggested Question Chips */
  .suggestions-wrapper{
    display:flex; align-items:center; gap:.45rem; padding:.5rem 1.4rem 0; overflow-x:auto;
    white-space:nowrap; -webkit-overflow-scrolling:touch; flex-shrink:0;
  }
  .suggestions-wrapper::-webkit-scrollbar{display:none}
  .sugg-label{font-size:.72rem; color:var(--ink-muted); margin-right:.2rem}
  .chip{
    font-size:.74rem; background:var(--surface); color:var(--ink-muted);
    border:1px solid var(--line); border-radius:14px; padding:.3rem .75rem;
    cursor:pointer; transition:all .2s; flex-shrink:0;
  }
  .chip:hover{border-color:var(--accent-b); color:var(--ink)}

  /* Mobile-Safe Input Dock */
  .input-area{padding:.6rem 1.4rem .9rem; border-top:1px solid var(--line); flex-shrink:0; display:flex; flex-direction:column; gap:.6rem;}
  .input-wrapper{
    position:relative; display:flex; align-items:center; width:100%; max-width:900px;
    margin:0 auto; border-radius:22px; background:var(--surface); border:1px solid var(--line);
    padding:.25rem .3rem .25rem .9rem; transition:border-color .25s;
  }
  .input-wrapper::before{
    content:""; position:absolute; inset:-1px; border-radius:23px; padding:1px;
    background:var(--accent-grad); background-size:300% 300%; animation:flow 5s ease infinite;
    opacity:0; transition:opacity .25s ease; z-index:-1;
  }
  .input-wrapper:focus-within{border-color:transparent}
  .input-wrapper:focus-within::before{opacity:1}
  .input-wrapper input{
    flex:1; min-width:0; background:transparent; border:none; padding:.65rem 0;
    color:var(--ink); font-family:inherit; font-size:.9rem; outline:none;
  }
  .send-btn{
    width:38px; height:38px; min-width:38px; flex-shrink:0; border:none; border-radius:14px;
    background:var(--accent-grad); background-size:300% 300%; animation:flow 5s ease infinite;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; margin-left:.4rem; transition:transform .12s ease;
  }
  .send-btn:hover{transform:scale(1.05)}
  .send-btn:active{transform:scale(.93)}
  .send-btn svg{width:16px; height:16px; stroke:#0c0f12}
  
  /* Disclaimer Warning */
  .disclaimer {
    text-align: center;
    font-size: 0.72rem;
    color: var(--ink-muted);
    max-width: 900px;
    margin: 0 auto;
    line-height: 1.4;
  }
  .disclaimer span {
    font-weight: 600;
  }

  @media (max-width:600px){
    header{padding:.7rem 1rem}
    .preset-bar{padding:.5rem 1rem}
    .story-container{padding:.7rem 1rem}
    .chat-container{padding:1rem}
    .suggestions-wrapper{padding:.4rem 1rem 0}
    .input-area{padding:.5rem 1rem .75rem}
    .message{max-width:92%; font-size:.88rem}
  }
</style>
</head>
<body>

<div class="topline"></div>

<header>
  <div class="brand brandfont">nano<span>GPT</span></div>
  <div class="controls">
    <button class="icon-btn" id="toggle-settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"/></svg>
    </button>
    <button class="icon-btn" id="toggle-theme" aria-label="Toggle theme">
      <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<div class="settings-panel" id="settings-panel">
  <div class="setting-group">
    <label>Model Engine</label>
    <select id="model_name">
      <optgroup label="Fire (33M Parameters)">
        <option value="fire-max" selected>Fire — Max (Targeted DPO v2)</option>
        <option value="fire-high">Fire — High (Baseline DPO v1)</option>
        <option value="fire-medium">Fire — Medium (Standard SFT)</option>
      </optgroup>
      <optgroup label="Fiko (15M Parameters)">
        <option value="fiko-max">Fiko — Max (Targeted DPO v2)</option>
        <option value="fiko-high">Fiko — High (Baseline DPO v1)</option>
        <option value="fiko-medium">Fiko — Medium (Standard SFT)</option>
      </optgroup>
    </select>
  </div>
  <div class="setting-group">
    <label>Temperature</label>
    <div class="range-row">
      <input type="range" id="temperature" value="0.0" step="0.1" min="0" max="1.5">
      <span id="temp-val">0.0</span>
    </div>
  </div>
  <div class="setting-group">
    <label>Max Tokens</label>
    <input type="number" id="max_tokens" value="50" min="5" max="100">
  </div>
</div>

<!-- Preset Stories Bar -->
<div class="preset-bar">
  <span class="preset-label">Stories:</span>
  <button class="pill-btn active" onclick="loadPreset(0)">Bakery & Tart</button>
  <button class="pill-btn" onclick="loadPreset(1)">Garden & Puppy</button>
  <button class="pill-btn" onclick="loadPreset(2)">Lost Ball</button>
  <button class="pill-btn custom-pill" id="custom-pill-btn" onclick="activateCustomStory()">✏️ Write Your Own</button>
</div>

<main>
  <div class="story-container">
    <div class="story-header">
      <label>Story Context</label>
      <span class="story-tip" id="story-tip">✨ Editable — paste or write any story below</span>
    </div>
    <textarea id="story" placeholder="Write or paste your story here (1-4 simple sentences work best for 15M/33M models)..."></textarea>
  </div>

  <div class="chat-container" id="chat-box">
    <div class="message ai">Ready when you are — pick a suggested question or type your own below!</div>
  </div>
</main>

<!-- Suggested Questions Row -->
<div class="suggestions-wrapper" id="suggestions"></div>

<div class="input-area">
  <div class="input-wrapper">
    <input type="text" id="question" placeholder="Ask a question about the story…" onkeypress="handleEnter(event)">
    <button class="send-btn" onclick="askQuestion()" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>
  <div class="disclaimer">
    <span>Warning:</span> NanoGPT is an experimental micro-model (15M-33M parameters). It may occasionally hallucinate details or make logic mistakes.
  </div>
</div>

<script>
  const presets = [
    {
      name: "Bakery & Tart",
      story: "Emma and her grandpa walked to the bakery. Emma carried a green purse and a silver coin. Emma wanted to buy a big chocolate cake, but Grandpa said it was too expensive. So, Emma looked at the cupcakes instead. A little orange cat ran past the door and hid under a wooden bench. After the cat disappeared, Grandpa bought a strawberry tart. Emma ate the tart happily. Then, they walked to the library.",
      questions: [
        "What color was Emma's purse?",
        "Why couldn't Emma buy the chocolate cake?",
        "What two things did Emma carry to the bakery?",
        "Where did they go after eating the tart?"
      ]
    },
    {
      name: "Garden & Puppy",
      story: "Sam and his puppy Toby went into the garden. Sam carried a blue bucket and a small shovel. Sam wanted to dig near the flowers, but Mom said no. So, Sam walked over to the sandbox. Toby ran around chasing butterflies until he stopped running and rested under the shade tree. Then Sam gave him a bowl of cool water.",
      questions: [
        "What color was Sam's bucket?",
        "Why couldn't Sam dig near the flowers?",
        "What two tools did Sam bring into the garden?",
        "Where did Sam go after Mom spoke to him?"
      ]
    },
    {
      name: "Lost Ball",
      story: "Tim lost his red ball in the garden. He searched behind the shed and found it under the oak tree. He wiped off the dirt and ran inside to show his sister.",
      questions: [
        "What color was Tim's ball?",
        "Where did Tim find his ball?",
        "Where did Tim search first?"
      ]
    }
  ];

  const genericQuestionTemplates = [
    "What color was the...?",
    "Where did... go?",
    "Why couldn't...?",
    "What did... do after...?",
    "What two things did...?"
  ];

  const storyInput = document.getElementById('story');
  const suggestionsBox = document.getElementById('suggestions');
  const pillBtns = document.querySelectorAll('.pill-btn');
  const customPillBtn = document.getElementById('custom-pill-btn');
  const chatBox = document.getElementById('chat-box');
  const questionInput = document.getElementById('question');
  const tempInput = document.getElementById('temperature');
  const tempVal = document.getElementById('temp-val');
  const storyTip = document.getElementById('story-tip');
  const clockIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>';

  function renderChips(list, isTemplate = false) {
    suggestionsBox.innerHTML = '<span class="sugg-label">Try:</span>';
    list.forEach(q => {
      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.textContent = q;
      chip.onclick = () => {
        questionInput.value = q;
        if (isTemplate) {
          questionInput.focus();
        } else {
          askQuestion();
        }
      };
      suggestionsBox.appendChild(chip);
    });
  }

  function loadPreset(index) {
    pillBtns.forEach((btn, idx) => btn.classList.toggle('active', idx === index));
    const p = presets[index];
    storyInput.value = p.story;
    storyTip.innerHTML = '✨ Preset loaded — feel free to edit text above!';
    renderChips(p.questions, false);
    appendMessage(`Loaded "${p.name}". Click a suggested question or write your own!`, 'ai');
  }

  function activateCustomStory() {
    pillBtns.forEach(btn => btn.classList.remove('active'));
    customPillBtn.classList.add('active');
    storyInput.value = '';
    storyInput.focus();
    storyTip.innerHTML = '✏️ Custom Mode: write or paste 1–4 simple sentences';
    renderChips(genericQuestionTemplates, true);
    appendMessage("✍️ Custom story mode ready! Type or paste your story into the box above, then ask any question about it.", "ai");
  }

  // Detect manual edits inside the story box and highlight custom mode
  storyInput.addEventListener('input', () => {
    if (!customPillBtn.classList.contains('active')) {
      pillBtns.forEach(btn => btn.classList.remove('active'));
      customPillBtn.classList.add('active');
      storyTip.innerHTML = '✏️ Custom story active';
      renderChips(genericQuestionTemplates, true);
    }
  });

  // Theme Toggle
  const themeBtn = document.getElementById('toggle-theme');
  const themeIcon = document.getElementById('theme-icon');
  const sunPaths = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  const moonPath = '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/>';
  themeBtn.addEventListener('click', () => {
    const isLight = document.body.getAttribute('data-theme') === 'light';
    if (isLight) { document.body.removeAttribute('data-theme'); themeIcon.innerHTML = sunPaths; }
    else { document.body.setAttribute('data-theme', 'light'); themeIcon.innerHTML = moonPath; }
  });

  // Settings Panel Toggle
  document.getElementById('toggle-settings').addEventListener('click', () => {
    document.getElementById('settings-panel').classList.toggle('active');
  });

  tempInput.addEventListener('input', () => tempVal.textContent = tempInput.value);

  function handleEnter(e){ if (e.key === 'Enter') askQuestion(); }

  function appendMessage(text, sender, meta){
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('message', sender);
    const textNode = document.createElement('div');
    textNode.innerText = text;
    msgDiv.appendChild(textNode);
    if (meta){
      const metaDiv = document.createElement('div');
      metaDiv.classList.add('meta-data');
      metaDiv.innerHTML = clockIcon + '<span>' + meta + '</span>';
      msgDiv.appendChild(metaDiv);
    }
    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function showTyping(){
    const t = document.createElement('div');
    t.className = 'message ai typing';
    t.id = 'typing-indicator';
    t.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
    chatBox.appendChild(t);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function removeTyping(){ document.getElementById('typing-indicator')?.remove(); }

  async function askQuestion(){
    const question = questionInput.value.trim();
    if (!question) return;

    const story = storyInput.value.trim();
    if (!story) {
      appendMessage("Please add a story in the story box above before asking a question!", "ai");
      return;
    }

    const model_name = document.getElementById('model_name').value;
    const temperature = parseFloat(tempInput.value);
    const max_tokens = parseInt(document.getElementById('max_tokens').value);

    appendMessage(question, 'user');
    questionInput.value = '';
    showTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ story, question, temperature, max_tokens, model_name })
      });
      const data = await res.json();
      removeTyping();
      if (res.ok){
        appendMessage(data.answer || 'No response generated.', 'ai',
          `${data.inference_time_ms} ms · ${data.tokens_generated} tokens · ${model_name.toUpperCase()}`);
      } else {
        appendMessage(`Error: ${data.detail}`, 'ai');
      }
    } catch (err) {
      removeTyping();
      appendMessage('Unable to reach the backend engine. Check your server connection.', 'ai');
    }
  }

  // Load first preset by default
  loadPreset(0);
</script>
</body>
</html>
