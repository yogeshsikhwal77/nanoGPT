<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NanoGPT: Story Q&A</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 2rem; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 680px; background: #1e293b; border-radius: 12px; padding: 2rem; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    h2 { margin-top: 0; color: #38bdf8; }
    label { display: block; font-weight: 600; margin-top: 1rem; margin-bottom: 0.4rem; color: #94a3b8; }
    textarea, input, select { width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 0.75rem; color: #f8fafc; font-size: 0.95rem; }
    textarea { resize: vertical; min-height: 100px; }
    .row { display: flex; gap: 1rem; }
    .col { flex: 1; }
    button { margin-top: 1.5rem; width: 100%; background: #0284c7; color: white; border: none; padding: 0.85rem; border-radius: 6px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    .result-box { margin-top: 1.5rem; padding: 1rem; background: #0f172a; border-radius: 6px; border-left: 4px solid #38bdf8; display: none; }
    .meta { margin-top: 0.5rem; font-size: 0.8rem; color: #64748b; }
  </style>
</head>
<body>
  <div class="container">
    <h2>NanoGPT Story Q&A</h2>
    <label for="story">Story</label>
    <textarea id="story">Tim lost his red ball in the garden. He searched behind the shed and found it under the oak tree.</textarea>
    
    <label for="question">Question</label>
    <input type="text" id="question" value="Where did Tim find his ball?">
    
    <div class="row">
      <div class="col">
        <label for="model_name">Model Select</label>
        <select id="model_name">
          <option value="fiko">Fiko (15M Parameters)</option>
          <option value="fire">Fire (33M Parameters)</option>
        </select>
      </div>
      <div class="col">
        <label for="temperature">Temperature</label>
        <input type="number" id="temperature" value="0.2" step="0.1" min="0" max="2">
      </div>
      <div class="col">
        <label for="max_tokens">Max Tokens</label>
        <input type="number" id="max_tokens" value="50" min="5" max="128">
      </div>
    </div>
    
    <button onclick="askQuestion()">Submit Question</button>
    
    <div id="result" class="result-box">
      <strong>Answer:</strong>
      <p id="answer-text" style="font-size: 1.1rem; color: #e2e8f0; margin: 0.5rem 0;"></p>
      <div id="meta-text" class="meta"></div>
    </div>
  </div>

  <script>
    async function askQuestion() {
      const story = document.getElementById("story").value;
      const question = document.getElementById("question").value;
      const model_name = document.getElementById("model_name").value;
      const temperature = parseFloat(document.getElementById("temperature").value);
      const max_tokens = parseInt(document.getElementById("max_tokens").value);
      
      const resBox = document.getElementById("result");
      const ansText = document.getElementById("answer-text");
      const metaText = document.getElementById("meta-text");

      ansText.innerText = "Generating...";
      metaText.innerText = "";
      resBox.style.display = "block";

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ story, question, temperature, max_tokens, model_name })
        });
        const data = await res.json();
        
        if (res.ok) {
            ansText.innerText = data.answer || "No response generated.";
            metaText.innerText = `Latency: ${data.inference_time_ms} ms | Tokens: ${data.tokens_generated} | Engine: ${model_name}`;
        } else {
            ansText.innerText = `Error: ${data.detail}`;
        }
      } catch (err) {
        ansText.innerText = "Error contacting backend.";
      }
    }
  </script>
</body>
</html>
